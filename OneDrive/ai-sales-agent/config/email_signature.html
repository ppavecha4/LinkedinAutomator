<!--
  Email signature — HTML version.

  Loaded at send time by send_pending_emails.py and the
  GoogleWorkspaceEmailChannel. Edits take effect on next send.

  Constraints:
    - Use TABLES, not flexbox/grid. Outlook strips most CSS.
    - Inline every style. <style> blocks get stripped by Gmail.
    - No external fonts. Arial / Helvetica / sans-serif only.
    - No remote images. Logo attached as inline MIME (cid:logo).
    - Keep total footprint < 8KB. Gmail clips long messages.
-->
